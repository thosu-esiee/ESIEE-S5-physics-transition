# TODO (student): Configure Nginx to serve the files in /usr/share/nginx/html
# and forward requests under /api/ to the service named api on TCP port 5000.
# Tip: keep the original /api/... path when proxying to Flask.

server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
  }

  location /api/ {
    proxy_pass http://api:5000;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
